name: Continuous Delivery (CD)

# Push lên main/dev hoặc gắn tag vX.Y.Z -> lint/test/build -> build Docker image -> push GHCR
# -> deploy Render (API trước, web sau) -> smoke test. Smoke test lỗi thì job đỏ (fail-fast).
# Không dùng secret tự tạo: đăng nhập GHCR bằng GITHUB_TOKEN có sẵn của Actions.
on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate (lint, test, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Run Linter
        run: pnpm run lint

      - name: Run Unit Tests
        run: pnpm run test

      - name: Build Applications
        run: pnpm run build

  build-and-push:
    name: Build & push image (${{ matrix.service }})
    needs: quality-gate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # GHCR yêu cầu tên image viết thường, trong khi tên owner có thể có chữ hoa.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag: sha-<commit ngắn> (luôn có), 1.2.3 và 1.2 khi push tag vX.Y.Z, latest khi push main.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_API_URL là URL công khai (không phải secret); đặt ở Settings > Variables.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          provenance: true

  # CV20: deploy bằng Render Deploy Hook, ghim đúng image sha-<commit> (không dùng latest)
  # để mỗi lần deploy truy vết và rollback được. Chưa cấu hình secret thì bỏ qua, không làm đỏ pipeline.
  deploy:
    name: Deploy production & smoke test
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check deploy configuration
        id: cfg
        env:
          HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API_URL }}
          HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB_URL }}
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$HOOK_API" ] || [ -z "$HOOK_WEB" ] || [ -z "$API_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chưa cấu hình RENDER_DEPLOY_HOOK_API_URL / RENDER_DEPLOY_HOOK_WEB_URL / biến API_URL. Bỏ qua deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image refs
        if: steps.cfg.outputs.ready == 'true'
        run: |
          BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="sha-${GITHUB_SHA::7}"
          echo "API_IMAGE=${BASE}/api:${TAG}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${BASE}/web:${TAG}" >> "$GITHUB_ENV"

      # API trước: Render kéo image, entrypoint chạy migrate (RUN_MIGRATIONS=true) rồi mới nhận traffic.
      - name: Deploy API
        if: steps.cfg.outputs.ready == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API_URL }}
        run: |
          curl -fsS -X POST "${HOOK}&imgURL=${API_IMAGE}" > /dev/null
          echo "Đã yêu cầu Render deploy ${API_IMAGE}"

      - name: Smoke test API
        if: steps.cfg.outputs.ready == 'true'
        run: bash scripts/smoke-test.sh "${{ vars.API_URL }}"

      - name: Deploy web
        if: steps.cfg.outputs.ready == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB_URL }}
        run: |
          curl -fsS -X POST "${HOOK}&imgURL=${WEB_IMAGE}" > /dev/null
          echo "Đã yêu cầu Render deploy ${WEB_IMAGE}"

      - name: Smoke test API + web
        if: steps.cfg.outputs.ready == 'true'
        run: bash scripts/smoke-test.sh "${{ vars.API_URL }}" "${{ vars.WEB_URL }}"
